<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isobar Weather</title>
<meta name="description" content="15-day forecasts with hourly and 3-hourly detail, an advanced map, model comparison and ensemble spread. Free data sources with automatic fallbacks.">
<meta name="theme-color" content="#e7ecf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090f15" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Isobar">
<meta name="format-detection" content="telephone=no">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1d27'/%3E%3Cg fill='none' stroke='%23f0a033' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M14 40c4-12 14-18 24-16s14 10 12 18'/%3E%3Cpath d='M22 42c3-7 9-10 15-9s8 6 7 11'/%3E%3C/g%3E%3Ccircle cx='38' cy='40' r='3.4' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/* Isobar — layout: sticky instrument bar; condition-driven sky hero; instrument cards in a responsive grid (1 col phone, 2 cols from 980px). */
:root{
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --font-body:"Hanken Grotesk","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;

  --bg:#e7ecf0; --bar:rgba(231,236,240,.88); --surface:#f8fafb; --surface-2:#edf1f4; --surface-3:#e1e8ed;
  --line:#d3dbe2; --line-2:#bccad4;
  --text:#0f1d27; --text-2:#30475a; --muted:#596d7e;
  --accent:#9c5800; --accent-fill:#f0a033; --accent-ink:#1d1305; --accent-soft:rgba(240,160,51,.17);
  --link:#0b6a8f;
  --ok:#2b8a4b; --warn:#a8670c; --bad:#c23b2b; --severe:#8b2a74; --info:#0b6a8f;
  --night:rgba(40,60,95,.075); --grid:rgba(15,29,39,.075); --grid-2:rgba(15,29,39,.2);
  --c-temp:#e0552d; --c-feels:#b0701c; --c-dew:#1c8a6c; --c-rain:#2b7fd0; --c-snow:#7e9fd1; --c-pop:#5864cf;
  --c-wind:#0f8579; --c-gust:#b4458b; --c-press:#6a4fb3; --c-cloud:#7a8a9a; --c-rh:#2a8fa0; --c-uv:#8f4fb5;
  --c-sun:#d79a00; --c-cape:#c2582d; --c-li:#4a5bb8;
  --m1:#d64f2a; --m2:#2b7fd0; --m3:#2b8a4b; --m4:#8f4fb5; --m5:#b07d10; --m6:#0f8579; --m7:#c2416a; --m8:#596d7e;
  --shadow:0 1px 2px rgba(15,29,39,.05),0 10px 26px -18px rgba(15,29,39,.35);
  --radius:18px; --radius-s:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090f15; --bar:rgba(9,15,21,.84); --surface:#0f1820; --surface-2:#142029; --surface-3:#1b2933;
    --line:#1e2c38; --line-2:#2b3d4c;
    --text:#e3ebf1; --text-2:#b4c3cf; --muted:#8597a8;
    --accent:#f4b04e; --accent-fill:#f4b04e; --accent-ink:#1d1305; --accent-soft:rgba(244,176,78,.15);
    --link:#6fcbea;
    --ok:#4fc27e; --warn:#e5a744; --bad:#f2735e; --severe:#d679cf; --info:#6fcbea;
    --night:rgba(140,170,215,.07); --grid:rgba(227,235,241,.075); --grid-2:rgba(227,235,241,.19);
    --c-temp:#ff7b4f; --c-feels:#ffb562; --c-dew:#4fd1a3; --c-rain:#5aa9ff; --c-snow:#b4cff6; --c-pop:#a4adff;
    --c-wind:#3ccfbe; --c-gust:#f08bc8; --c-press:#b59eff; --c-cloud:#9db0c2; --c-rh:#57c6d6; --c-uv:#cf98f0;
    --c-sun:#ffcb4d; --c-cape:#ff9a6b; --c-li:#9aa8ff;
    --m1:#ff7b4f; --m2:#5aa9ff; --m3:#5fd18b; --m4:#cf98f0; --m5:#f0c14a; --m6:#3ccfbe; --m7:#ff86ad; --m8:#9db0c2;
    --shadow:0 12px 30px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090f15; --bar:rgba(9,15,21,.84); --surface:#0f1820; --surface-2:#142029; --surface-3:#1b2933;
  --line:#1e2c38; --line-2:#2b3d4c;
  --text:#e3ebf1; --text-2:#b4c3cf; --muted:#8597a8;
  --accent:#f4b04e; --accent-fill:#f4b04e; --accent-ink:#1d1305; --accent-soft:rgba(244,176,78,.15);
  --link:#6fcbea;
  --ok:#4fc27e; --warn:#e5a744; --bad:#f2735e; --severe:#d679cf; --info:#6fcbea;
  --night:rgba(140,170,215,.07); --grid:rgba(227,235,241,.075); --grid-2:rgba(227,235,241,.19);
  --c-temp:#ff7b4f; --c-feels:#ffb562; --c-dew:#4fd1a3; --c-rain:#5aa9ff; --c-snow:#b4cff6; --c-pop:#a4adff;
  --c-wind:#3ccfbe; --c-gust:#f08bc8; --c-press:#b59eff; --c-cloud:#9db0c2; --c-rh:#57c6d6; --c-uv:#cf98f0;
  --c-sun:#ffcb4d; --c-cape:#ff9a6b; --c-li:#9aa8ff;
  --m1:#ff7b4f; --m2:#5aa9ff; --m3:#5fd18b; --m4:#cf98f0; --m5:#f0c14a; --m6:#3ccfbe; --m7:#ff86ad; --m8:#9db0c2;
  --shadow:0 12px 30px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent-fill);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.i.fill{fill:currentColor}
.num{font-variant-numeric:tabular-nums}
.note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;line-height:1.1}
.btn:hover{border-color:var(--text-2)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.btn.small{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{display:flex;align-items:center;gap:10px;min-height:58px}
.loc-btn{display:flex;align-items:center;gap:9px;min-width:0;flex:1;background:none;border:0;padding:6px 6px 6px 2px;text-align:left;border-radius:12px}
.loc-btn:hover{background:var(--surface-2)}
.loc-pin{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;background:var(--text);color:var(--surface)}
.loc-pin svg{width:18px;height:18px}
.loc-text{display:flex;flex-direction:column;min-width:0}
.loc-name{font:700 17.5px/1.15 var(--font-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-chev{color:var(--muted);flex:none;display:grid}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text-2);padding:0}
.icon-btn:hover{color:var(--text);border-color:var(--line-2)}
.icon-btn.txt{font:700 13px var(--font-body);width:auto;min-width:38px;padding:0 10px;border-radius:19px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
.flag-btn{width:42px;height:38px;display:inline-grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0}
.flag-btn:hover{border-color:var(--line-2)}
.flag-btn svg.flag{width:28px;height:19px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12);display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden}
.progress::after{content:"";position:absolute;top:0;bottom:0;width:32%;background:var(--accent-fill);animation:prog 1.1s ease-in-out infinite}
@keyframes prog{from{left:-32%}to{left:100%}}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--text-2);font:700 12.5px/1 var(--font-body);padding:7px 12px;border-radius:999px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.seg.wide{display:flex}
.seg.wide button{flex:1;padding:9px 12px;font-size:13.5px}
.mode-seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mode-seg button svg.i{width:15px;height:15px}
.mob-only{margin-top:12px}
.top-only{display:none}
@media (min-width:760px){.mob-only{display:none!important}.top-only{display:inline-flex}}
@media (max-width:370px){#unitBtn{display:none}}

/* ---------- banner / toast ---------- */
.banner{margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px 10px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-fill);font-size:13.5px}
.banner.err{background:rgba(194,59,43,.1);border-color:var(--bad)}
.banner .btn{flex:none}
.toast{position:fixed;z-index:90;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);max-width:calc(100vw - 32px)}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius);color:#fff;margin-top:12px;padding:16px 18px 14px;min-height:250px;background:linear-gradient(168deg,var(--sky1) 0%,var(--sky2) 100%);box-shadow:var(--shadow);transition:min-height .25s}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.26) 100%);pointer-events:none}
.hero{--sky1:#2a4459;--sky2:#5f7a90}
.hero[data-sky="clear-day"]{--sky1:#1554a8;--sky2:#5298d9}
.hero[data-sky="partly-day"]{--sky1:#245a98;--sky2:#7ea6c9}
.hero[data-sky="cloudy-day"]{--sky1:#3f5772;--sky2:#8599ad}
.hero[data-sky="clear-night"]{--sky1:#050a1d;--sky2:#24356a}
.hero[data-sky="cloudy-night"]{--sky1:#0f1724;--sky2:#34445b}
.hero[data-sky="rain"]{--sky1:#1b2c3e;--sky2:#4b6782}
.hero[data-sky="snow"]{--sky1:#47607e;--sky2:#93a8bf}
.hero[data-sky="storm"]{--sky1:#13152a;--sky2:#433d5d}
.hero[data-sky="fog"]{--sky1:#4a5866;--sky2:#87939e}
.hero-iso-wrap{position:absolute;left:28%;top:-75%;width:130%;height:230%;z-index:-3;pointer-events:none}
.hero-iso{width:100%;height:100%;animation:isoTurn 160s linear infinite;transform-origin:50% 50%}
@keyframes isoTurn{to{transform:rotate(360deg)}}
.hero-fx{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.hero-inner{position:relative;text-shadow:0 1px 3px rgba(0,0,0,.28)}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;opacity:.95;flex-wrap:wrap}
.hero-src{opacity:.85}
.hero-main{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.hero-l{min-width:0}
.hero-temp{font:300 clamp(80px,25vw,136px)/.92 var(--font-display);letter-spacing:-.055em;font-variation-settings:"opsz" 96;margin-left:-.04em}
.hero-temp .u{font-size:.42em;vertical-align:top;letter-spacing:0;margin-left:.06em;opacity:.9;line-height:1.3}
.hero-icon{flex:none;margin-right:-6px}
.hero-icon svg{width:clamp(104px,32vw,152px);height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))}
.hero-cond{font:600 21px/1.2 var(--font-display);margin-top:2px;letter-spacing:-.01em}
.hero-meta{font-size:14.5px;margin-top:3px}
.hero-sum{margin:12px 0 0;font-size:15px;line-height:1.42;max-width:60ch;background:rgba(5,12,20,.24);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:9px 12px;text-shadow:none}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.hero-coords{font-size:12px;opacity:.85}
.hero-btns{display:flex;gap:8px}
.hero-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;display:inline-grid;place-items:center;padding:0}
.hero-btn:hover{background:rgba(255,255,255,.22)}
.hero-btn.on{background:rgba(255,214,120,.25);border-color:rgba(255,214,120,.7);color:#ffd677}
.hero-loading{display:grid;place-items:center;min-height:210px;font:600 18px var(--font-display);opacity:.9}
.hero.compact{min-height:0;padding:12px 16px}
.hero.compact .hero-temp{font-size:clamp(56px,16vw,84px)}
.hero.compact .hero-icon svg{width:clamp(72px,20vw,96px)}
.hero.compact .hero-foot{margin-top:6px}

/* ---------- layout ---------- */
.basic-grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
/* equal column bottoms: the last card of each column takes the leftover height */
#daily{flex:1 1 auto;display:flex;flex-direction:column}
#activities{flex:1 1 auto;display:flex;flex-direction:column}
@media (min-width:980px){.basic-grid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 16px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;margin-bottom:12px;flex-wrap:wrap}
.card-t{margin:0;font:700 12px/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.card-t svg.i{width:16px;height:16px}
.card-sub{margin:-6px 0 12px;font-size:13px;color:var(--text-2)}
.skel{height:120px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.empty-state{padding:18px 4px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}

/* ---------- alerts & nowcast ---------- */
.alerts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px}
.alerts::-webkit-scrollbar{display:none}
.al{flex:none;display:flex;align-items:center;gap:9px;border-radius:12px;padding:8px 12px 8px 8px;border:1px solid var(--line);background:var(--surface);text-align:left;max-width:300px;color:var(--text)}
.al .sev{width:4px;align-self:stretch;border-radius:2px;background:var(--info)}
.al.s2 .sev{background:var(--warn)} .al.s3 .sev{background:var(--bad)}
.al svg.i{color:var(--text-2)}
.al b{display:block;font-size:13.5px;line-height:1.2}
.al small{display:block;font-size:12px;color:var(--muted)}
.nc-dry{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--text-2)}
.nc-dry svg.i{color:var(--c-rain)}
.nc-text{margin:0 0 10px;font-weight:700}
.nc-bars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;align-items:end;height:64px;border-bottom:1px solid var(--line-2)}
.nc-bars i{display:block;border-radius:3px 3px 0 0;background:var(--surface-3)}
.nc-bars i.w{background:var(--c-rain)}
.nc-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- hourly strip ---------- */
.hs-scroll{overflow-x:auto;overscroll-behavior-x:contain;margin:0 -16px;padding:0 16px 4px;scrollbar-width:thin}
.hs{position:relative}
.hs-row{display:grid;grid-template-columns:repeat(var(--n),58px)}
.hc{text-align:center;font-size:12.5px;color:var(--text-2);padding:2px 0;position:relative;min-height:18px}
.hc em{position:absolute;left:4px;top:-1px;font-style:normal;font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.hs-row:first-child .hc{padding-top:12px}
.hc.ds{box-shadow:inset 1px 0 0 var(--line-2)}
.hc .wx{display:block;margin:2px auto}
.hp b{display:block;color:var(--c-rain);font-size:12px}
.hp b.z{color:var(--muted);opacity:.5}
.hp small{display:block;font-size:10.5px;color:var(--muted)}
.hw{display:flex;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted)}
.warr{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hs-svg{display:block}
.hs-svg .tl{fill:none;stroke:var(--c-temp);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.hs-svg circle{fill:var(--surface);stroke:var(--c-temp);stroke-width:2}
.hs-svg text{fill:var(--text);font:700 13px var(--font-body);font-variant-numeric:tabular-nums}
.hs-svg .sep{stroke:var(--line-2);stroke-width:1}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- daily ---------- */
.drows{display:flex;flex-direction:column}
.dd{border-top:1px solid var(--line)}
.dd:first-child{border-top:0}
.dd>summary{list-style:none;display:grid;grid-template-columns:74px 34px 40px 34px minmax(28px,1fr) 34px 16px;align-items:center;gap:7px;padding:8px 0;cursor:pointer;border-radius:8px}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary:hover{background:var(--surface-2)}
.d-day b{display:block;font-size:14px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-day small{font-size:11.5px;color:var(--muted)}
.d-ic .wx{display:block}
.d-pop{color:var(--c-rain);font-size:12px;font-weight:700;text-align:center;white-space:nowrap}
.d-min{color:var(--muted);text-align:right;font-size:14.5px}
.d-max{font-weight:700;font-size:14.5px}
.tbar{position:relative;height:6px;border-radius:3px;background:var(--surface-3)}
.tbar i{position:absolute;top:0;bottom:0;border-radius:3px;min-width:6px}
.tbar b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);border:2.5px solid var(--text)}
.chev{color:var(--muted);transition:transform .2s;width:16px;height:16px}
.dd[open] .chev{transform:rotate(180deg)}
.d-exp{padding:4px 0 14px}

.dt-big{max-height:min(70vh,640px)}
.mtbl td,.mtbl th{min-width:44px;text-align:center}
.mtbl th:first-child,.mtbl td:first-child{text-align:left}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px 14px;margin:0}
.kv div{min-width:0}
.kv dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font:600 15px/1.3 var(--font-display);font-variant-numeric:tabular-nums}
.dbar{position:relative;height:26px;border-radius:7px;overflow:hidden;margin-top:12px;display:flex}
.dbar span{height:100%}
.dbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent-fill);box-shadow:0 0 0 1px var(--surface)}
.dbar-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.src-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.src-list li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.src-list .ok{color:var(--ok);font-weight:700}
.src-list .bad{color:var(--bad);font-weight:700}
.src-list small{color:var(--muted)}
.prob-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;align-items:end;height:84px;margin-top:6px}
.prob-row div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;font-size:10px;color:var(--muted)}
.prob-row i{width:100%;max-width:18px;border-radius:4px 4px 1px 1px;background:var(--c-rain);display:block;min-height:2px}
.prob-row em{font-style:normal;font-weight:700;color:var(--text-2)}
.pol{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:10px}
.pol div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.pol span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pol b{font:600 16px var(--font-display);font-variant-numeric:tabular-nums}
.pol small{color:var(--muted);font-size:11px}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(4,9,14,.48);z-index:60}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:90vh;display:flex;flex-direction:column;background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:720px){.sheet{left:50%;right:auto;bottom:auto;top:8vh;transform:translateX(-50%);width:min(580px,calc(100vw - 32px));max-height:84vh;border-radius:20px;animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font:700 19px var(--font-display);letter-spacing:-.01em}
.sheet-b{overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;font-size:16px;outline:none}
.search:focus-within{border-color:var(--accent-fill);box-shadow:0 0 0 3px var(--accent-soft)}
.rlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.rlist li{display:flex;align-items:center;gap:4px}
.rbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 8px;border-radius:10px;text-align:left}
.rbtn:hover,.rbtn.act{background:var(--surface-2)}
.rbtn svg.i{color:var(--muted)}
.rbtn b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn span{min-width:0}
.rlist .icon-btn{width:34px;height:34px;flex:none}
.sec-t{margin:18px 0 4px;font:700 11.5px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-top:10px}
.set-grid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--text-2);font-weight:700;min-width:0}
.set-grid select{width:100%}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.set-row:last-child{border-bottom:0}
.set-range{display:inline-flex;align-items:center;gap:10px;flex:none}
.set-range input[type=range]{width:150px;accent-color:var(--accent);cursor:pointer}
.set-range output{min-width:42px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--surface-3);border:1px solid var(--line-2);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+span{background:var(--accent-fill);border-color:var(--accent-fill)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent-fill);outline-offset:2px}
.about{font-size:13.5px;color:var(--text-2);line-height:1.5}
.about p{margin:8px 0}
.al-list{display:grid;gap:12px}
.al-item{border-left:4px solid var(--info);padding:2px 0 2px 12px}
.al-item.s2{border-color:var(--warn)} .al-item.s3{border-color:var(--bad)}
.al-item h3{margin:0;font:700 15px var(--font-display)}
.al-item p{margin:3px 0 0;font-size:13.5px;color:var(--text-2)}

/* ---------- footer ---------- */
.foot{margin:26px 0 24px;color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:baseline}
.foot b{font:700 14px var(--font-display);color:var(--text-2)}

/* ---------- weather icons ---------- */
.wx{display:inline-block;vertical-align:middle;overflow:visible;flex:none}
.wx .ib-sun{fill:url(#ib-sun)}
.wx .ib-rays{fill:none;stroke:#f5ae32;stroke-width:2.6;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
.wx .ib-moon{fill:url(#ib-moon);stroke:rgba(120,105,60,.4);stroke-width:1;vector-effect:non-scaling-stroke}
.wx .ib-cl{fill:url(#ib-cloud);stroke:rgba(62,82,106,.45);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wx .ib-cd{fill:url(#ib-cloud-d);stroke:rgba(36,50,66,.5)}
.wx .ib-drop{fill:none;stroke:#3a8edb;stroke-width:2.6;stroke-linecap:round}
.wx .ib-ice{stroke:#5fb8e0}
.wx .ib-dz{fill:#3a8edb}
.wx .ib-flake{fill:none;stroke:#5c95d1;stroke-width:1.9;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
.wx .ib-bolt{fill:#ffc93a;stroke:#d99300;stroke-width:1;stroke-linejoin:round}
.wx .ib-hail{fill:#f4f8fb;stroke:#5c95d1;stroke-width:1.2}
.wx .ib-fog{fill:none;stroke:#8c9cab;stroke-width:3.2;stroke-linecap:round}
.wx .ib-star{fill:#f3df95}
.ib-anim .ib-rays{animation:ibSpin 30s linear infinite}
.ib-anim .ib-fl{animation:ibFloat 6s ease-in-out infinite}
.ib-anim .ib-drop{animation:ibDrop 1.15s linear infinite}
.ib-anim .ib-dz{animation:ibDz 1.4s ease-in infinite}
.ib-anim .ib-flake{animation:ibFlake 2.6s linear infinite}
.ib-anim .ib-bolt{animation:ibFlash 3.2s ease-in-out infinite}
.ib-anim .ib-fog{animation:ibFog 5s ease-in-out infinite}
.ib-anim .ib-star{animation:ibTwinkle 2.4s ease-in-out infinite}
@keyframes ibSpin{to{transform:rotate(360deg)}}
@keyframes ibFloat{0%,100%{transform:translateX(0)}50%{transform:translateX(1.6px)}}
@keyframes ibDrop{0%{transform:translate(1px,-5px);opacity:0}15%{opacity:1}100%{transform:translate(-2px,7px);opacity:0}}
@keyframes ibDz{0%{transform:translateY(-3px);opacity:0}25%{opacity:1}100%{transform:translateY(6px);opacity:0}}
@keyframes ibFlake{0%{transform:translateY(-5px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(8px) rotate(120deg);opacity:0}}
@keyframes ibFlash{0%,86%,100%{opacity:1}88%{opacity:.25}90%{opacity:1}92%{opacity:.35}}
@keyframes ibFog{0%,100%{transform:translateX(-2px)}50%{transform:translateX(3px)}}
@keyframes ibTwinkle{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ib-anim *,.hero-iso{animation:none!important}}
.no-anim .ib-anim *,.no-anim .hero-iso{animation:none!important}

.trend-wrap{flex:1 1 auto;display:flex;flex-direction:column;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);min-height:190px}
.trend-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.trend-lg{display:inline-flex;align-items:center;gap:5px 6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}

.trend-lg .lg-max{background:var(--c-temp)} .trend-lg .lg-min{background:var(--c-rain)} .trend-lg .lg-rain{background:var(--c-rain);opacity:.45;height:8px;width:8px}
.trend{position:relative;flex:1 1 auto;min-height:164px;margin-top:6px}
.trend svg{position:absolute;inset:0;display:block}
.tr-grid{stroke:var(--grid);stroke-width:1}
.tr-base{stroke:var(--line-2);stroke-width:1}
.tr-we{fill:var(--night)}
.tr-band{fill:var(--c-temp);opacity:.12}
.tr-max{fill:none;stroke:var(--c-temp);stroke-width:2.2;stroke-linejoin:round}
.tr-min{fill:none;stroke:var(--c-rain);stroke-width:2.2;stroke-linejoin:round}
.tr-dmax{fill:var(--surface);stroke:var(--c-temp);stroke-width:2}
.tr-dmin{fill:var(--surface);stroke:var(--c-rain);stroke-width:2}
.tr-rain{fill:var(--c-rain);opacity:.5}
.tr-ax,.tr-day{font:11px var(--font-body);fill:var(--muted)}
.tr-date{font:10px var(--font-body);fill:var(--muted);opacity:.85;font-variant-numeric:tabular-nums}
.tr-v{font:700 11px var(--font-body);fill:var(--text);font-variant-numeric:tabular-nums}

/* lazy loaders for heavier extras */
const Lazy = {
  io: null,
  observe() {
    if (!('IntersectionObserver' in window)) { ['advEns', 'advModels'].forEach(id => this.trigger(id)); return; }
    if (this.io) this.io.disconnect();
    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) this.trigger(e.target.id); }), { rootMargin: '200px' });
    ['advEns', 'advModels', 'advMap'].forEach(id => { const el = document.getElementById(id); if (el) this.io.observe(el); });
  },
  trigger(id) {
    if (App.mode !== 'advanced' || !App.data || App.data.provider !== 'Open-Meteo') { if (id === 'advMap') MapView.activate(); return; }
    if (id === 'advEns') loadExtra('ens');

  }
};
async function loadExtra(kind) {
  const key = kind + 'For', locKey = App.loc ? App.loc.lat.toFixed(3) + ',' + App.loc.lon.toFixed(3) : '';
  if (App[key] === locKey && (App[kind] || App[kind + 'State'] === 'loading')) return;
  App[key] = locKey; App[kind + 'State'] = 'loading'; App[kind] = null;
  const render = { ens: renderEnsemble, models: renderModels, normals: renderClimate }[kind];
  render();
  try {
    const fn = { ens: getEnsemble, models: getModels, normals: getNormals }[kind];
    const r = await fn(App.loc);
    if (App[key] !== locKey) return;
    App[kind] = r; App[kind + 'State'] = 'ok';

}

/* ---------- series for the chosen range and step ---------- */
function advRangeIdx(o) {
  const H = o.h, i0 = hourIdx(o), r = S.adv.range; let a, b;
  if (r === '48h') { a = Math.max(0, i0 - 6); b = Math.min(H.t.length, i0 + 49); }
  else { const ds = TZ.dayStart(Date.now()); a = H.t.findIndex(x => x >= ds); if (a < 0) a = 0; b = r === '7d' ? Math.min(H.t.length, a + 7 * 24 + 1) : H.t.length; }
  while (b > a + 2 && !isNum(H.temp[b - 1])) b--;
  return [a, b];
}
/* Every row at time T describes the period that starts at T: instant values are read at T,
   sums/maxima/codes come from the following hour(s) (Open-Meteo stores them on the hour they end). */
const FWD_KEYS = new Set(['precip', 'rain', 'showers', 'snow', 'sun', 'et0', 'pop', 'wg', 'code']);
function aggregate(o, a, b, step) {
  const H = o.h, n = H.t.length, out = { t: [], idx: [] }; for (const k of H_KEYS) out[k] = [];
  let s = a; if (step === 3) while (s < b && TZ.parts(H.t[s]).h % 3 !== 0) s++;
  for (let i = s; i < b; i += step) {
    out.t.push(H.t[i]); out.idx.push(i);
    const fw = range(i + 1, Math.min(n, i + 1 + step));
    for (const k of H_KEYS) {
      if (FWD_KEYS.has(k)) { const arr = pick(H[k], fw); out[k].push(!fw.length ? null : k === 'code' ? worstCode(arr) : SUM_KEYS.has(k) ? sumOf(arr) : maxOf(arr)); }
      else if (step === 3 && MAX_KEYS.has(k)) out[k].push(maxOf(pick(H[k], range(i, Math.min(n, i + 3)))));
      else out[k].push(H[k][i]);
    }
  }
  return out;
}
function advSeries(o) { const [a, b] = advRangeIdx(o); return aggregate(o, a, b, S.adv.step); }

function lazyBody(state, err, kind) {
  if (state === 'loading' || state === '' || state == null) return '<div class="skel"></div>';
  if (state === 'error') return `<div class="empty-state">${esc(t('loadFailed'))} ${esc(err || '')}<button class="btn small" type="button" data-load="${kind}">${esc(t('retry'))}</button></div>`;
  return `<div class="empty-state"><button class="btn small" type="button" data-load="${kind}">${esc(t('load'))}</button></div>`;
}

/* ---------- loading ---------- */
async function setLocation(loc, opts = {}) {
  const prev = keyOf(App.loc);
  App.loc = { ...loc, lat: +loc.lat, lon: +loc.lon };
  Store.set('lastLoc', slimLoc(App.loc));
  if (!opts.noRecent && !loc.approx) Recents.add(App.loc);
  if (keyOf(App.loc) !== prev) {
    Object.assign(App, { aq: null, aqState: '', marine: null, marineState: '', ens: null, ensState: '', models: null, modelsState: '', normals: null, normalsState: '', ensFor: '', modelsFor: '', normalsFor: '', extrasFor: '' });
    if (MapView.map) MapView.grid = null;
  }
  renderLocName(); updateHash();
  const cached = Cache.get(App.loc, S.adv.model);
  App.data = cached || null;
  renderAll();
  if (cached && Date.now() - cached.fetchedAt < 10 * 60e3) { loadExtras(); if (App.mode === 'advanced') MapView.activate(); return; }
  await refresh();
  if (!loc.name || loc.coords || (!loc.admin && !loc.country)) {
    const nm = await reverseName(App.loc.lat, App.loc.lon);
    if (nm && keyOf(App.loc) === keyOf(loc)) {
      if (!loc.name || loc.coords) Object.assign(App.loc, nm); else Object.assign(App.loc, { admin: nm.admin, country: nm.country, cc: nm.cc });
      App.loc.coords = false; Store.set('lastLoc', slimLoc(App.loc)); if (!loc.approx) Recents.add(App.loc); renderLocName(); updateHash();
    }
  }
}
async function refresh() {
  if (!App.loc) return;
  const id = ++App.reqId; setProgress(true);
  try {
    const d = await getForecast(App.loc, S.adv.model, name => { if (!App.data && id === App.reqId) { const el = $('.hero-loading'); if (el) el.textContent = t('contacting', { p: name }); } });
    if (id !== App.reqId) return;
    App.data = d;
    if (!App.loc.tz && d.tz) { App.loc.tz = d.tz; Store.set('lastLoc', slimLoc(App.loc)); }
    Cache.put(App.loc, S.adv.model, d);
    if (d.fallback) showBanner(t('fallbackUsed', { q: d.provider, n: d.days }), '', { label: t('retry'), fn: () => refresh() });
    else if (d.modelFallback) showBanner(t('modelFell', { m: modelLabel(d.modelFallback) }));
    else hideBanner();
    renderAll(); loadExtras();
    if (App.mode === 'advanced') MapView.activate();
  } catch (e) {
    if (id !== App.reqId) return;
    if (App.data) { showBanner(navigator.onLine === false ? t('offlineStale', { t: ago(App.data.fetchedAt) }) : t('staleData', { t: ago(App.data.fetchedAt) }), 'err', { label: t('retry'), fn: () => refresh() }); renderAll(); }
    else renderError(e);
  } finally { if (id === App.reqId) setProgress(false); }
}

  const loc = App.loc, key = keyOf(loc); if (!loc) return;
  if (App.extrasFor === key && Date.now() - App.extrasAt < 20 * 60e3) return;
  App.extrasFor = key; App.extrasAt = Date.now(); App.aqState = 'loading'; App.marineState = 'loading';
  const [aq, mar] = await Promise.allSettled([getAirQuality(loc), getMarine(loc)]);
  if (keyOf(App.loc) !== key) return;
  App.aq = aq.status === 'fulfilled' ? aq.value : null; App.aqState = App.aq ? 'ok' : 'none';
  App.marine = mar.status === 'fulfilled' ? mar.value : null; App.marineState = App.marine ? 'ok' : 'none';

}

    <div class="about"><p>${esc(t('about1'))}</p><p>${esc(t('about2'))}</p><p>${esc(t('about3'))}</p><p>${esc(t('about4'))}</p><p class="muted">Isobar v${APP_VERSION} · <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · <a href="https://api.met.no/" target="_blank" rel="noopener">MET Norway</a> · <a href="https://wttr.in/" target="_blank" rel="noopener">wttr.in</a> · <a href="https://www.7timer.info/" target="_blank" rel="noopener">7Timer!</a> · <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a></p></div>
  </div>`;
  openSheet(sh);
}
function openAlerts(focusIdx) {
  const sh = $('#infoSheet'), A = App.alerts || [];
  sh.innerHTML = sheetHead('infoTitle', t('headsUp')) + `<div class="sheet-b"><div class="al-list">${A.map((a, i) => `<div class="al-item s${a.sev}"${i === focusIdx ? ' style="background:var(--surface-2);border-radius:0 8px 8px 0"' : ''}><h3>${esc(a.title)}</h3><p><b>${esc(a.when)}</b> · ${esc(a.detail)}</p></div>`).join('')}</div><p class="note">${esc(t('alDisclaimer'))}</p></div>`;
  openSheet(sh);
}

/* ---------- actions ---------- */
function switchLang() {
  S.lang = LANG === 'tr' ? 'en' : 'tr'; saveSettings();
  applyLang(); setStaticTexts(); renderLocName(); renderAll();
  toast(t('langSwitched'), 1800);
}
function speak() {
  if (!('speechSynthesis' in window) || !App.data) return;
  if (App.speaking) { speechSynthesis.cancel(); App.speaking = false; renderHero(); return; }
  const o = App.data, di = dayIdx(o), c = curOf(o), deg = v => fmtN(Units.t(v), 0) + ' ' + t('degrees');
  const text = t('speech', { place: App.loc.name, cond: wmoText(c.code), temp: deg(c.temp), feels: deg(c.feels), hi: deg(o.d.tmax[di]), lo: deg(o.d.tmin[di]) }) + ' ' + heroSummary(o).replace(/°/g, ' ' + t('degrees'));
  const u = new SpeechSynthesisUtterance(text.replace('−', '-')); u.lang = LANG === 'tr' ? 'tr-TR' : 'en-GB';
  const v = (speechSynthesis.getVoices() || []).find(x => x.lang && x.lang.toLowerCase().startsWith(LANG)); if (v) u.voice = v;
  u.onend = u.onerror = () => { App.speaking = false; renderHero(); };
  App.speaking = true; renderHero(); speechSynthesis.speak(u);
}
async function share() {
  const o = App.data; if (!o) return;
  const di = dayIdx(o), c = curOf(o), text = `${App.loc.name}: ${F.t(c.temp)}, ${wmoText(c.code)}. ${t('hiLo', { h: F.t(o.d.tmax[di]), l: F.t(o.d.tmin[di]) })}. ${heroSummary(o)}`;
  const url = /^https?:/.test(location.protocol) ? location.href : '';
  if (navigator.share) { try { await navigator.share({ title: 'Isobar · ' + App.loc.name, text, url: url || undefined }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text + (url ? '\n' + url : '')); toast(t('copied')); } catch (e) { toast(t('shareFail')); }
}
function clearCache() { Cache.clearAll(); App.normals = null; App.normalsState = ''; toast(t('cacheCleared')); if (App.mode === 'advanced') renderClimate(); }
function makeTouchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, 180); g.addColorStop(0, '#16324f'); g.addColorStop(1, '#0b1620'); x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = 'rgba(240,160,51,.95)'; x.lineWidth = 7; x.lineCap = 'round';
    for (const [r, a] of [[78, 0.9], [56, 0.75], [34, 0.6]]) { x.globalAlpha = a; x.beginPath(); x.ellipse(108, 112, r * 1.15, r, -0.2, Math.PI * 0.95, Math.PI * 2.05); x.stroke(); }
    x.globalAlpha = 1; x.fillStyle = '#fff'; x.beginPath(); x.arc(108, 112, 9, 0, 6.283); x.fill();
    const png = c.toDataURL('image/png');
    $('#touchIcon').setAttribute('href', png);
    /* installable on Android/desktop when served over http(s): a generated manifest */
    if (/^https?:$/.test(location.protocol)) {
      const base = location.href.split('#')[0];
      const man = { name: 'Isobar Weather', short_name: 'Isobar', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#090f15', theme_color: '#0f1d27', icons: [{ src: png, sizes: '180x180', type: 'image/png', purpose: 'any' }] };
      const link = document.createElement('link'); link.rel = 'manifest';
      link.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
      document.head.appendChild(link);
    }
  } catch (e) { /* ignore */ }
}

/* ---------- events ---------- */
function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('button,[data-close],a'); if (!el) { if (e.target.id === 'backdrop') closeSheets(); return; }
    const d = el.dataset;
    if (el.id === 'locBtn') return openLocSheet();
    if (el.id === 'settingsBtn') return openSettings();
    if (el.id === 'langBtn') return switchLang();
    if (el.id === 'refreshBtn') { App.extrasFor = ''; return refresh(); }
    if (el.id === 'unitBtn') { S.units.temp = S.units.temp === 'C' ? 'F' : 'C'; return onUnitsChanged(); }
    if (el.id === 'useMyLoc') return useMyLocation();
    if (el.id === 'csvBtn') return exportCSV();
    if (el.id === 'mapPlay') return MapView.togglePlay();
    if (el.id === 'mapPrev') return MapView.stepTime(-1);
    if (el.id === 'mapNext') return MapView.stepTime(1);
    if (el.id === 'mapUpd') return MapView.ensureGrid(true);
    if (el.id === 'mapRecenter') return MapView.recenter();
    if (d.close !== undefined) return closeSheets();
    if (d.mode) return setMode(d.mode);
    if (d.hstep) { S.hourStep = +d.hstep; saveSettings(); return renderHourly(); }
    if (d.dv) { S.dailyView = d.dv; saveSettings(); return renderDaily(); }
    if (d.chips) return ChipScroll.step(el);
    if (d.strip) return MapView.stripPage(+d.strip);
    if (d.actId) { S.activity = d.actId; saveSettings(); return renderActivities(); }
    if (d.alert !== undefined) return openAlerts(+d.alert);
    if (d.pick) { const p = resolveRef(d.pick); if (p) { closeSheets(); setLocation(p); } return; }
    if (d.favref) { const p = resolveRef(d.favref); if (!p) return; if (d.favref[0] === 'f') Favs.remove(p); else Favs.toggle(p); renderLocLists(); const ul = $('#results'); if (ul && _results.length) ul.innerHTML = _results.map((r, i) => locItem(r, 'r' + i)).join(''); if (App.data) renderHero(); return; }
    if (d.act === 'speak') return speak();
    if (d.act === 'share') return share();
    if (d.act === 'fav') { if (App.loc) { const on = Favs.toggle(App.loc); toast(t(on ? 'savedPlace' : 'removedPlace')); renderHero(); } return; }
    if (d.act === 'clearcache') return clearCache();
    if (d.open) { setMode('advanced'); setTimeout(() => { const card = $(d.open === 'aq' ? '#advAQ' : '#advMarine'); if (card) card.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); }, 120); return; }
    if (d.range) { S.adv.range = d.range; saveSettings(); renderMeteogram(); return renderTable(); }
    if (d.astep) { S.adv.step = +d.astep; saveSettings(); renderMeteogram(); return renderTable(); }
    if (d.panel) { const p = S.adv.panels; S.adv.panels = p.includes(d.panel) ? p.filter(x => x !== d.panel) : PANEL_ORDER.filter(k => k === d.panel || p.includes(k)); saveSettings(); return renderMeteogram(); }
    if (d.load) { if (d.load === 'normals') App.normalsFor = ''; else App[d.load + 'For'] = ''; return loadExtra(d.load); }
    if (d.aqi) { S.aqi = d.aqi; saveSettings(); renderAQCard(); return renderFooter(); }
    if (d.layer) { S.adv.layer = d.layer; saveSettings(); MapView.renderCard(); return MapView.applyLayer(); }
    if (d.mtoggle) { S.adv[d.mtoggle] = !S.adv[d.mtoggle]; saveSettings(); el.setAttribute('aria-pressed', String(S.adv[d.mtoggle])); if (d.mtoggle === 'grey') return MapView.setBase(); MapView.drawField(); return MapView.restartParticles(); }
    if (d.mscale) { S.adv.scale = d.mscale; saveSettings(); MapView._frame = null; MapView.syncControls(); MapView.drawField(); return MapView.renderLegend(); }
    if (d.tjump !== undefined) return MapView.jumpTo(+d.tjump);
    if (d.goto) { const [lat, lon] = d.goto.split(',').map(Number); if (MapView.map) MapView.map.closePopup(); return setLocation({ lat, lon, name: `${lat.toFixed(3)}, ${lon.toFixed(3)}`, coords: true }); }
    if (d.preset) { Object.assign(S.units, UNIT_PRESETS[d.preset]); onUnitsChanged(); return openSettings(); }
    if (d.themeSet) { S.theme = d.themeSet; saveSettings(); applyTheme(); renderAll(); MapView.themeChanged(); return openSettings(); }
    if (d.heatmap) { S.heatmap = d.heatmap; saveSettings(); $$('[data-heatmap]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.heatmap === S.heatmap))); if (App.data && App.mode === 'basic') renderDaily(); return; }
  });
  $('#backdrop').addEventListener('click', closeSheets);
  document.addEventListener('change', e => {
    const el = e.target, v = el.value;
    const unitMap = { uTemp: 'temp', uWind: 'wind', uPrecip: 'precip', uPress: 'pressure', uDist: 'dist', uTime: 'time' };
    if (unitMap[el.id]) { S.units[unitMap[el.id]] = v; onUnitsChanged(); $$('[data-preset]').forEach(b => b.setAttribute('aria-pressed', String(presetOn(b.dataset.preset)))); return; }
    if (el.id === 'sAqi') { S.aqi = v; saveSettings(); return renderAll(); }
    if (el.id === 'sFade') { S.adv.fade = +v; saveSettings(); return MapView.drawField(); }
    if (el.id === 'sPlay') { S.adv.playMs = +v; saveSettings(); if (MapView.playing) { MapView.stopPlay(); MapView.startPlay(); } return; }
    if (el.id === 'sAnim') { S.anim = el.checked; saveSettings(); applyTheme(); renderAll(); HeroFX.loop(); return MapView.restartParticles(); }
    if (el.id === 'sModel' || el.id === 'advModel') { S.adv.model = v; saveSettings(); const c = Cache.get(App.loc, v); if (c) { App.data = c; renderAll(); } return refresh(); }
    if (el.id === 'mapBase') { S.adv.base = v; saveSettings(); return MapView.setBase(); }
    if (el.id === 'cmpVar') { S.adv.cmpVar = v; saveSettings(); return renderModels(); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'mapTime') MapView.onTime(+e.target.value);
    if (e.target.id === 'sFade') { S.adv.fade = +e.target.value; const o = $('#sFadeV'); if (o) o.textContent = fmtPct(S.adv.fade); MapView.drawField(); }
  });
  document.addEventListener('toggle', e => {
    const dd = e.target; if (!dd.classList || !dd.classList.contains('dd') || !dd.open) return;
    const box = dd.querySelector('.d-exp'); if (box && !box.dataset.done && App.data) { box.innerHTML = dayDetail(App.data, +dd.dataset.day); box.dataset.done = '1'; }
  }, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#backdrop').hidden) { e.preventDefault(); return closeSheets(); }
    const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.ctrlKey || e.metaKey || e.altKey || !$('#backdrop').hidden) return;
    if (e.key === '/') { e.preventDefault(); openLocSheet(); }
    else if (e.key === 'r') refresh();
    else if (e.key === 'm') setMode(App.mode === 'basic' ? 'advanced' : 'basic');
    else if (e.key === 'u') { S.units.temp = S.units.temp === 'C' ? 'F' : 'C'; onUnitsChanged(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { MapView.stopParticles(); return; }
    if (App.data && Date.now() - App.data.fetchedAt > 15 * 60e3) refresh(); else if (App.data) renderHero();
    if (App.mode === 'advanced') MapView.restartParticles();
  });
  window.addEventListener('online', () => { if (App.loc) refresh(); });
  window.addEventListener('offline', () => { if (App.data) showBanner(t('offlineStale', { t: ago(App.data.fetchedAt) }), 'err'); });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') { applyTheme(); renderAll(); MapView.themeChanged(); } });
  setInterval(() => { if (document.hidden || !App.data) return; if (Date.now() - App.data.fetchedAt > 30 * 60e3) refresh(); else renderHero(); }, 5 * 60e3);
}

/* ---------- start ---------- */
/* First visit: show Karabiga straight away, then move to the device location if the user shares it. */
async function firstRun() {
  setLocation({ ...HOME }, { noRecent: true });
  let p;
  try { p = await geolocate(); } catch (e) { toast(t('locDenied'), 5500); return; }
  if (haversine(p.lat, p.lon, HOME.lat, HOME.lon) < 2) return;
  const nm = await reverseName(p.lat, p.lon);
  setLocation({ lat: p.lat, lon: p.lon, name: nm ? nm.name : t('myLocation'), admin: nm ? nm.admin : '', country: nm ? nm.country : '', cc: nm ? nm.cc : '', tz: localZone() });
}
function init() {
  applyLang(); applyTheme(); setStaticTexts();
  $('#heroIso').innerHTML = isobarSvg();
  HeroFX.init(); makeTouchIcon(); bindEvents();
  const fromHash = parseHash(), last = Store.get('lastLoc', null);
  Net.listeners.add(debounce(() => { if (App.mode === 'advanced' && App.data && $('#advSources')) renderSources(); }, 600));
  if (fromHash) {
    const known = [last, ...Favs.list(), ...Recents.list()].find(l => l && isNum(l.lat) && sameLoc(l, fromHash));
    setLocation(known ? { ...known } : fromHash, { noRecent: true });
  }
  else if (last && isNum(last.lat)) setLocation(last, { noRecent: true });
  else firstRun();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
