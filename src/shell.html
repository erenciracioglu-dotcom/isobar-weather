<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isobar Weather</title>
<meta name="description" content="15-day forecasts with hourly and 3-hourly detail, an advanced map, model comparison and ensemble spread. Free data sources with automatic fallbacks.">
<meta name="theme-color" content="#e7ecf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090f15" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Isobar">
<meta name="format-detection" content="telephone=no">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1d27'/%3E%3Cg fill='none' stroke='%23f0a033' stroke-width='3.2' stroke-linecap='round'%3E%3Cpath d='M14 40c4-12 14-18 24-16s14 10 12 18'/%3E%3Cpath d='M22 42c3-7 9-10 15-9s8 6 7 11'/%3E%3C/g%3E%3Ccircle cx='38' cy='40' r='3.4' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" id="touchIcon">
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
/*STYLE*/
</style>
<!-- GoatCounter (no cookies): counts visits on the GitHub Pages site only, not when the file is opened locally -->
<script>(function () {
  if (!/\.github\.io$/.test(location.hostname)) return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter', 'https://isobar.goatcounter.com/count');
  document.head.appendChild(s);
})();</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="ib-sun" cx="40%" cy="36%" r="70%"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#f59c1a"/></radialGradient>
    <linearGradient id="ib-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd8e3"/></linearGradient>
    <linearGradient id="ib-cloud-d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3c0ce"/><stop offset="1" stop-color="#73849a"/></linearGradient>
    <linearGradient id="ib-moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdf6d9"/><stop offset="1" stop-color="#d6c995"/></linearGradient>
  </defs>
</svg>
<header class="topbar" id="topbar">
  <div class="wrap topbar-in">
    <button class="loc-btn" id="locBtn" type="button" aria-haspopup="dialog">
      <span class="loc-pin" id="locPin"></span>
      <span class="loc-text"><span class="loc-name" id="locName">Isobar</span><span class="loc-sub" id="locSub"></span></span>
      <span class="loc-chev" id="locChev"></span>
    </button>
    <div class="top-actions">
      <div class="seg mode-seg top-only" id="modeSegTop" role="group"></div>
      <button class="icon-btn txt" id="unitBtn" type="button"></button>
      <button class="icon-btn" id="refreshBtn" type="button"></button>
      <button class="icon-btn" id="settingsBtn" type="button"></button>
      <button class="flag-btn" id="langBtn" type="button"></button>
    </div>
  </div>
  <div class="progress" id="progress" hidden></div>
</header>
<div class="wrap">
  <div class="seg wide mode-seg mob-only" id="modeSegMob" role="group"></div>
  <div class="banner" id="banner" hidden></div>
  <main id="main">
    <section class="hero" id="hero" data-sky="loading">
      <div class="hero-iso-wrap" id="heroIso" aria-hidden="true"></div>
      <canvas class="hero-fx" id="heroFx" aria-hidden="true"></canvas>
      <div class="hero-inner" id="heroInner"></div>
    </section>
    <div id="basicView" class="basic-grid">
      <div class="col">
        <div id="alerts" hidden></div>
        <div id="nowcast" hidden></div>
        <section class="card" id="hourly"></section>
        <section class="card" id="daily"></section>
      </div>
      <div class="col">
        <section class="card" id="outlook"></section>
        <section class="details" id="details"></section>
        <section class="card" id="activities"></section>
      </div>
    </div>
    <div id="advView" hidden></div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="locSheet" role="dialog" aria-modal="true" aria-labelledby="locTitle" hidden></section>
<section class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden></section>
<section class="sheet" id="infoSheet" role="dialog" aria-modal="true" aria-labelledby="infoTitle" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">Isobar needs JavaScript to load the forecast.</p></noscript>
<script>
/*SCRIPT*/
</script>
</body>
</html>
